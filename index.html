<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9e8df">
<title>디지털 명함</title>
<script src="config.js"></script>
<link rel="preload" href="assets/PPNeueGstaad-Regular.otf" as="font" type="font/otf" crossorigin>
<style>
  @font-face { font-family: "PP Neue Gstaad"; src: url("assets/PPNeueGstaad-Regular.otf") format("opentype"); font-weight: 400; font-display: swap; }
  :root { --olive: #6b733e; --ink: #0b0b08; --paper: #e9e8df; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: "PP Neue Gstaad", "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 400;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100svh; padding: 20px 16px calc(28px + env(safe-area-inset-bottom)); overflow-x: hidden;
  }
  #bgVideo { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; opacity: .35; }

  .top { width: min(100%, 440px); display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; }
  .brand { font-size: 17px; font-weight: 400; }
  .brand sup { font-size: .55em; }

  /* ===== 3D 회전 명함 ===== */
  .stage { width: min(90vw, 440px); aspect-ratio: 1.75; perspective: 1400px; margin: 9vh 0 0; cursor: pointer; touch-action: pan-y; }
  .card { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transform: rotateY(var(--ry, 0deg)); }
  /* 처음 진입: 뒷면(음각 로고)에서 시작해 반 바퀴 돌아 앞면에서 멈춤 */
  .card.spin { animation: spin 2.4s cubic-bezier(.5,0,.2,1) both; }
  @keyframes spin {
    0%   { transform: translateY(30px) scale(.85) rotateY(-180deg) rotateX(12deg); }
    100% { transform: translateY(0) scale(1) rotateY(0deg) rotateX(0); }
  }
  /* 모서리 컷(투명 영역)이 그대로 보이도록 이미지 자체를 마스크로 사용 */
  :root { --thick: 7px; }   /* 명함 두께 */
  /* 기울기 없이 정면 (필요하면 transform 에 rotateX/rotateY 를 넣어 기울일 수 있음) */
  .tilt { width: 100%; height: 100%; transform-style: preserve-3d; transform: none; }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    transform: translateZ(calc(var(--thick) / 2 + .05px));
  }
  .face i {
    position: absolute; inset: 0; background: var(--img) center / 100% 100% no-repeat;
    -webkit-mask: var(--img) center / 100% 100% no-repeat; mask: var(--img) center / 100% 100% no-repeat;
  }
  .face.back { transform: rotateY(180deg) translateZ(calc(var(--thick) / 2 + .05px)); }
  /* 종이 질감 (2번 사진 같은 코튼/펠트지 결) */
  .face i::after { content: ""; position: absolute; inset: 0; background: url("assets/paper.png") 0 0 / 220px 220px repeat; pointer-events: none; }
  /* 두께: 명함 모양 그대로 얇은 층을 겹쳐 옆면을 만듦 */
  .edge {
    position: absolute; inset: 0; background: #565d31;
    -webkit-mask: var(--shape) center / 100% 100% no-repeat; mask: var(--shape) center / 100% 100% no-repeat;
    transform: translateZ(var(--z));
  }
  .shadow { width: 76%; height: 16px; margin: 3vh auto 0; border-radius: 50%; background: rgba(40,42,20,.35); filter: blur(12px); }
  .cardVideo { width: min(90vw, 440px); margin: 9vh 0 0; }

  /* ===== 정보 + 버튼 ===== */
  .info { width: min(100%, 440px); margin-top: 6vh; display: grid; gap: 4px;
          opacity: 0; animation: up .7s 2.0s ease-out forwards; }
  .info h1 { font-size: 34px; font-weight: 400; line-height: 1; }
  .info .role { font-size: 20px; }
  .actions { width: min(100%, 440px); display: grid; gap: 10px; margin-top: 28px; opacity: 0; animation: up .7s 2.2s ease-out forwards; }
  .btn {
    display: flex; align-items: center; justify-content: space-between; min-height: 56px; padding: 0 20px; border-radius: 0;
    font-size: 17px; text-decoration: none; color: var(--ink); background: transparent; border: 1px solid var(--ink);
    -webkit-tap-highlight-color: transparent; transition: background .2s, color .2s;
  }
  .btn::after { content: "→"; }
  .btn.primary { background: var(--olive); color: var(--ink); border-color: var(--olive); font-weight: 400; }
  .btn.primary::after { content: "+"; font-size: 22px; }
  .btn:active { background: var(--ink); color: var(--paper); }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .row .btn { min-height: 52px; padding: 0 10px; gap: 6px; font-size: 14px; white-space: nowrap; }
  .hint { font-size: 12px; margin-top: 14px; opacity: .5; }
  @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .card.spin { animation: none; } .info, .actions { animation-delay: 0s; } }
</style>
</head>
<body>
  <video id="bgVideo" autoplay muted loop playsinline hidden></video>

  <header class="top"><span class="brand" id="brand"></span><span>Digital Card</span></header>

  <div id="cardWrap">
    <div class="stage" id="stage" aria-label="명함 (터치하면 앞뒤 뒤집기)">
      <div class="tilt"><div class="card" id="card">
        <div id="edges"></div>
        <div class="face front"><i id="front"></i></div>
        <div class="face back"><i id="back"></i></div>
      </div></div>
    </div>
    <div class="shadow"></div>
  </div>

  <div class="info">
    <h1 id="name"></h1>
    <p class="role" id="sub"></p>
  </div>

  <div class="actions">
    <a class="btn primary" id="saveBtn" href="contact.vcf" download="contact.vcf">연락처에 저장</a>
    <div class="row">
      <a class="btn" id="mailBtn">Mail</a>
      <a class="btn" id="igBtn" target="_blank" rel="noopener">Instagram</a>
      <a class="btn" id="webBtn" target="_blank" rel="noopener">semo.works</a>
    </div>
    <p class="hint">명함을 터치하면 앞면 · 뒷면이 바뀌어요</p>
  </div>

<script>
(function () {
  const C = window.CARD || {};
  const $ = (id) => document.getElementById(id);
  if (C.accentColor) document.documentElement.style.setProperty('--accent', C.accentColor);
  document.title = (C.name || '디지털 명함') + ' · 명함';

  $('name').textContent = C.name || '';
  $('sub').textContent = C.title || '';
  $('brand').innerHTML = (C.company || '').replace(/</g,'&lt;') + '<sup>©</sup>';
  C.email   ? $('mailBtn').href = 'mailto:' + C.email                       : $('mailBtn').remove();
  C.instagram ? $('igBtn').href = 'https://instagram.com/' + C.instagram : $('igBtn').remove();
  if (C.website) { $('webBtn').href = C.website; $('webBtn').textContent = C.website.replace(/^https?:\/\//, '').replace(/\/$/, ''); } else $('webBtn').remove();

  // iOS 사파리는 download 속성 없이 .vcf 를 열어야 "연락처 추가" 화면이 바로 뜸
  const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (isIOS) $('saveBtn').removeAttribute('download');

  if (C.backgroundVideo) { const v = $('bgVideo'); v.src = C.backgroundVideo; v.hidden = false; }

  // 명함 영상(mp4)을 쓰는 경우: 3D 카드 대신 영상 재생
  if (C.cardVideo) {
    $('cardWrap').innerHTML = '<video class="cardVideo" src="' + C.cardVideo + '" autoplay muted playsinline></video>';
    return;
  }

  const face = (el, src) => { el.style.setProperty('--img', 'url("' + src + '")'); };
  face($('front'), C.cardFront); face($('back'), C.cardBack);
  // 두께용 층 (앞면 모양 기준: 모서리 컷 포함)
  const edges = $('edges'), T = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--thick')) || 7, L = 15;
  edges.style.cssText = 'position:absolute;inset:0;transform-style:preserve-3d;--shape:url("' + C.cardFront + '")';
  for (let k = 0; k < L; k++) { const d = document.createElement('div'); d.className = 'edge'; d.style.setProperty('--z', (-T / 2 + T * k / (L - 1)).toFixed(2) + 'px'); edges.appendChild(d); }

  const card = $('card'), stage = $('stage');
  let ry = 0, dragging = false, startX = 0, startRy = 0;
  const set = () => card.style.setProperty('--ry', ry + 'deg');
  const spin = () => { ry = 0; set(); card.classList.remove('spin'); void card.offsetWidth; card.classList.add('spin'); };
  card.addEventListener('animationend', (e) => { if (e.animationName === 'spin') card.classList.remove('spin'); });
  spin();

  // 터치하면 앞면 ↔ 뒷면 뒤집기 (좌우로 끌어서 돌려볼 수도 있음)
  const ease = 'transform .8s cubic-bezier(.45,.05,.25,1)';
  stage.addEventListener('pointerdown', (e) => { dragging = true; startX = e.clientX; startRy = ry; card.style.transition = 'none'; card.classList.remove('spin'); });
  window.addEventListener('pointermove', (e) => { if (!dragging) return; ry = startRy + (e.clientX - startX) * 0.6; set(); });
  window.addEventListener('pointerup', (e) => {
    if (!dragging) return; dragging = false;
    card.style.transition = ease;
    if (Math.abs(e.clientX - startX) < 6) { ry = Math.round(ry / 180) * 180 + 180; set(); return; }
    ry = Math.round(ry / 180) * 180; set();
  });
})();
</script>
</body>
</html>
